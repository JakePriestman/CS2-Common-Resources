name: Deploy Common Resources

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-cs2
  BICEP_FILE: ./infrastructure/deploy.bicep
  PARAMETERS_FILE: ./infrastructure/parameters.json
  PACKAGE_PATH: ./publish

permissions: 
  id-token: write 
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
         client-id: ${{ secrets.AZURE_CLIENT_ID }} 
         tenant-id: ${{ vars.AZURE_TENANT_ID }} 
         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure using Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --template-file ${{ env.BICEP_FILE }} \
              --parameters @${{ env.PARAMETERS_FILE }} \
              --debug
